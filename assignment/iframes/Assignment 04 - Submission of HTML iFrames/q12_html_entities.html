<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Entities</title>
</head>
<body>

  <h1>Displaying Special Characters using HTML Entities</h1>

  <p>
    Less than: &lt; &nbsp;&nbsp;
    Greater than: &gt; &nbsp;&nbsp;
    Ampersand: &amp; &nbsp;&nbsp;
    Double quote: &quot; &nbsp;&nbsp;
    Single quote: &apos;
  </p>

  <p>
    Copyright: &copy; &nbsp;&nbsp;
    Trademark: &trade; &nbsp;&nbsp;
    Registered: &reg;
  </p>

</body>
</html>
